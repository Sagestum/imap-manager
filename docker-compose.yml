services:
  imap-manager:
    build: .
    image: imap-manager:latest
    container_name: imap-manager
    restart: unless-stopped
    networks:
      - httpd
    volumes:
      - imap_manager_data:/app/data
      - imap_manager_export:/app/export
      - imap_manager_config:/app/config
    environment:
      - FDM_WEBUI_HOST=0.0.0.0
      - FDM_WEBUI_PORT=5000
      - FDM_CONFIG_DIR=/app/config

  fdm-runner:
    build:
      context: .
      dockerfile: runner/Dockerfile
    image: imap-manager-runner:latest
    container_name: fdm-runner
    restart: unless-stopped
    volumes:
      - imap_manager_config:/app/config
    environment:
      - FDM_CONFIG_DIR=/app/config
      # Cron-Syntax, z.B. "*/5 * * * *" fuer alle 5 Minuten
      - "CRON_SCHEDULE=${FDM_CRON_SCHEDULE:-*/5 * * * *}"
      # wie oft (Sekunden) auf die .run_now-Trigger-Datei geprueft wird
      - "TRIGGER_POLL_INTERVAL=${FDM_TRIGGER_POLL_INTERVAL:-5}"

# "httpd" ist das Docker-Netzwerk von nginxmanager (jc21/nginx-proxy-manager) auf dem Docker-Host
# "eden" - der Proxy-Host in nginxmanager zeigt auf http://imap-manager:5000, Docker-DNS loest den
# Container-Namen innerhalb dieses Netzwerks auf. Kein VIRTUAL_HOST/LETSENCRYPT_HOST-Mechanismus
# (das waere jwilder/nginx-proxy, laeuft auf eden nicht) und kein Host-Port noetig.
networks:
  httpd:
    external: true

# Extern verwaltete Volumes (frueher per Portainer-Stack "imap" angelegt, daher der Praefix) -
# ueberleben einen Stack-Neuaufbau, enthalten die echten Konten/Passwoerter/Statistiken.
volumes:
  imap_manager_data:
    external: true
    name: imap_imap_manager_data
  imap_manager_export:
    external: true
    name: imap_imap_manager_export
  imap_manager_config:
    external: true
    name: imap_imap_manager_config
