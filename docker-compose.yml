services:
  imap-manager:
    build: .
    image: imap-manager:latest
    container_name: imap-manager
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - imap_manager_data:/app/data
      - imap_manager_export:/app/export
    environment:
      - FDM_WEBUI_HOST=0.0.0.0
      - FDM_WEBUI_PORT=5000

volumes:
  imap_manager_data:
  imap_manager_export:
